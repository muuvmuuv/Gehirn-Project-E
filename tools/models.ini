; llama-server router preset for gehirn: the core plus the three MAGI, all resident at once.
;   llama-server --models-preset tools/models.ini --models-max 4 --host 127.0.0.1 --port 8081
; The aliases are the default chat models of main.v load_config, which names this file, and
; port 8081 is in its default GEHIRN_URL.
; Section names carry no colon: the router upper-cases the tag after a colon ([qwen3:8b] would
; route as "qwen3:8B"), so gehirn's model names are aliases instead.
version = 1

[*]
n-gpu-layers = all
flash-attn = on
parallel = 2
; each instance would otherwise keep up to 8 GiB of host RAM as prompt cache
cache-ram = 0
; --fit sizes against one process's view of the GPU and cannot see the other three
fit = off
; hides the plain cache entries of the four files below from /models
dedup-cache-models = 1

; the core: must answer inside CORE_TIMEOUT_MS, so no thinking; gehirn also sends
; reasoning_effort none (CORE_REASONING), and this covers CORE_REASONING=default
[qwen3-8b]
hf-repo = Qwen/Qwen3-8B-GGUF:Q4_K_M
alias = qwen3:8b
load-on-startup = true
ctx-size = 4096
n-predict = 512
reasoning = off

; MELCHIOR: harmony analysis channel lands in reasoning_content, not in content
[gpt-oss-20b]
hf-repo = ggml-org/gpt-oss-20b-GGUF:MXFP4
alias = gpt-oss:20b
load-on-startup = true
ctx-size = 8192
n-predict = 1536
; gehirn sends the same per request (MELCHIOR_REASONING); this covers MELCHIOR_REASONING=default
reasoning-effort = low
; no reasoning-budget: it ends one analysis message, and with a json_schema grammar gpt-oss
; just opens the next one, so the total is not capped (15 x 96 tokens seen in one reply)

; BALTHASAR with BALTHASAR_BACKEND=llm; the default asks Jev. Text only, skip the vision projector
[gemma3-4b]
hf-repo = ggml-org/gemma-3-4b-it-GGUF:Q4_K_M
alias = gemma3:4b
load-on-startup = true
ctx-size = 4096
n-predict = 512
mmproj-auto = false

; CASPER
[llama3.1-8b]
hf-repo = bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M
alias = llama3.1:8b
load-on-startup = true
ctx-size = 4096
n-predict = 512
