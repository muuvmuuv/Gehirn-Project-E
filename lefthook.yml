# Git hooks for gehirn. Activate once per clone with `lefthook install`.
#
# pre-commit checks what is staged, so unstaged work in progress cannot fail a
# commit. It calls the justfile's recipes, which hold the commands, on the staged
# files. The tests run on a copy of the staged tree that git checkout-index
# writes, with thirdparty/ linked in so zenoh-c is fetched once, and take 4 to
# 8 seconds whenever a .v file is staged.

pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: gitleaks git --pre-commit --redact --staged --verbose
      fail_text: a staged change looks like a key; keys live in .env only

    - name: v fmt
      glob: "*.{v,vsh}"
      run: just fmt {staged_files}
      fail_text: run `v fmt -w` on the files listed

    - name: v vet
      glob: "*.v"
      run: just vet {staged_files}

    - name: v test
      glob: "*.v"
      run: just zenoh && d=$(mktemp -d) && git checkout-index --all --prefix="$d/" && ln -s "$PWD/thirdparty" "$d/thirdparty" && (cd "$d" && just test); s=$?; rm -rf "$d"; exit $s

    - name: python
      glob: "*.py"
      run: just py {staged_files}

    - name: shell
      glob: "*.sh"
      run: just shell {staged_files}
      fail_text: run `shfmt -i 4 -ci -w` on the files listed, and fix what shellcheck reports

    - name: justfile
      glob: "justfile"
      run: just --fmt --check
      fail_text: run `just --fmt`

    - name: workflows
      glob: ".github/workflows/*.yml"
      run: actionlint {staged_files}

commit-msg:
  jobs:
    - name: conventional commit
      run: |
        subject=$(grep -v '^#' {1} | grep -m1 . || true)
        case "$subject" in
          Merge*|Revert*|fixup!*|squash!*) exit 0 ;;
        esac
        if ! printf '%s' "$subject" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|style|test)(\([a-z0-9/_-]+\))?!?: .+'; then
          echo "Not a Conventional Commit:"
          echo
          echo "    $subject"
          echo
          echo "  <type>[(scope)][!]: <subject>"
          echo "  type:  build chore ci docs feat fix perf refactor style test"
          echo "  scope: optional, from the list in CONTRIBUTING.md, Commits"
          exit 1
        fi

    # Claude Code adds a Co-authored-by trailer unless told not to.
    - name: no trailers
      run: |
        if grep -qiE '^(co-authored-by|signed-off-by):' {1}; then
          echo "Drop the Co-authored-by and Signed-off-by trailers; commits here carry none."
          exit 1
        fi
