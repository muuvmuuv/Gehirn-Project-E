<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>gehirn teaser</title>
<!--
  The teaser 否決は、覆らない for X (?cut=x, 1920x1080) and Instagram Reels (?cut=reel, 1080x1920).
  render(t) sets every element from t alone, so render.mjs can shoot any frame in isolation.
  Footage is gehirn's own bridge: assets/media/magi.gif, assets/media/bridge/scene.png and
  assets/media/scenes/ep06-yashima.mp4, extracted into src/ by build.sh.
-->
<style>
  @font-face { font-family: Zen; src: url(fonts/ZenOldMincho-Black.ttf); }
  @font-face { font-family: BarlowB; src: url(fonts/BarlowCondensed-Black.ttf); }
  @font-face { font-family: BarlowS; src: url(fonts/BarlowCondensed-SemiBold.ttf); }
  :root {
    --ink: #040406; --paper: #ECE8E1; --orange: #FF8D00; --dim: #8B8680;
    --alert: #FF2030; --aye: #52E691; --ember: #7A4300;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: var(--ink); color: var(--paper); -webkit-font-smoothing: antialiased; }
  body.x { width: 1920px; height: 1080px; }
  body.reel { width: 1080px; height: 1920px; }
  .abs { position: absolute; }
  .jp { font-family: Zen, serif; }
  .en { font-family: BarlowB, sans-serif; text-transform: uppercase; letter-spacing: .06em; }
  .sm { font-family: BarlowS, sans-serif; letter-spacing: .04em; }
  .hide { display: none !important; }
  .invis { visibility: hidden; }
  .shadow { text-shadow: 0 2px 12px rgba(4, 4, 6, .9), 0 0 3px rgba(4, 4, 6, .9); }

  /* Hazard bands as on social.png: stripes at 45 degrees, each as wide as the band is high */
  .hz { position: absolute; left: 0; right: 0; height: var(--h);
    background: repeating-linear-gradient(-45deg, #3D2200 0 calc(var(--h) * .7071), #140B02 calc(var(--h) * .7071) calc(var(--h) * 1.4142)); }

  /* Footage */
  #foot { position: absolute; overflow: hidden; }
  #foot img { position: absolute; left: 0; top: 0; }
  #y6full { transform-origin: 0 0; width: 1280px; height: 800px; }
  #radar { position: absolute; overflow: hidden; }
  #radimg { position: absolute; width: 1008px; height: 712px; }
  #radimg img { width: 1008px; height: 712px; }
  /* Covers the status line left of HUMAN 1.04 M, which the push would cut mid-word */
  #radimg i { position: absolute; left: 0; top: 652px; width: 680px; height: 38px; background: linear-gradient(90deg, #0B0806 90%, transparent); }

  /* Tab, like the bridge's panel tabs: an orange box with ink text, the Japanese beside it */
  #tab { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  #tab .box { background: var(--orange); color: var(--ink); padding: 0 10px; }
  #tab .jp { color: var(--orange); background: var(--ink); padding: 0 8px; }

  #chip { display: flex; align-items: center; gap: 14px; white-space: nowrap; background: rgba(12, 9, 6, .9); border: 2px solid currentColor; }
  #chip.no { color: var(--alert); }
  #chip.yes { color: var(--aye); }

  #capE { color: var(--orange); text-wrap: balance; }
  .en { text-wrap: balance; }
  .strip { color: var(--dim); white-space: nowrap; }

  /* Card frame: ember edge with orange corner brackets */
  .frame { position: absolute; border: 1px solid var(--ember); }
  .frame i { position: absolute; width: 28px; height: 28px; border: 0 solid var(--orange); }
  .frame i:nth-child(1) { left: -2px; top: -2px; border-left-width: 3px; border-top-width: 3px; }
  .frame i:nth-child(2) { right: -2px; top: -2px; border-right-width: 3px; border-top-width: 3px; }
  .frame i:nth-child(3) { left: -2px; bottom: -2px; border-left-width: 3px; border-bottom-width: 3px; }
  .frame i:nth-child(4) { right: -2px; bottom: -2px; border-right-width: 3px; border-bottom-width: 3px; }

  /* A centred line: --cy is the line's centre, --fs its size */
  .ln { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap;
    font-size: var(--fs); line-height: 1.4; top: calc(var(--cy) - var(--fs) * .7); }
  .dim { color: var(--dim); }
  .or { color: var(--orange); }
  .layer { position: absolute; inset: 0; background: var(--ink); }

  /* ---------- X, 1920x1080 ---------- */
  body.x #foot { left: 220px; top: 16px; width: 1480px; height: 827px; }
  body.x #gif, body.x #y6 { width: 1480px; height: 827px; }
  /* The radar from below its SCENE header, which the push would cut */
  body.x #radar { left: 456px; top: 106px; width: 1008px; height: 648px; }
  body.x #radimg { left: 0; top: -64px; }
  body.x #tab { left: 236px; top: 28px; height: 44px; font-size: 34px; }
  body.x #tab .box { height: 44px; line-height: 44px; }
  body.x #tab.radar { left: 456px; top: 54px; }
  body.x #chip { left: 1262px; top: 470px; height: 66px; padding: 0 20px; font-size: 36px; }
  body.x #capJ { --cy: 900px; --fs: 60px; }
  body.x #capE { --cy: 985px; --fs: 52px; }
  body.x #strip { left: 40px; right: 40px; top: 1044px; height: 28px; font-size: 21px; line-height: 28px; display: flex; justify-content: space-between; }
  body.x #strip .h { display: flex; gap: 18px; }
  body.x #strip .sj { font-size: 19px; }
  body.x .card .frame { left: 160px; top: 270px; width: 1600px; height: 560px; }
  body.x #cardFan { --cy: 990px; --fs: 32px; }

  /*
    Reels, 1080x1920. Instagram covers y 0-269 and 1536-1920, and its buttons x 944 and up
    below y 1010, so the captions under the footage end at x 930.
  */
  body.reel #foot, body.reel #radar { left: 40px; top: 330px; width: 1000px; height: 559px; }
  body.reel #gif, body.reel #y6 { width: 1000px; height: 559px; }
  body.reel #radimg { left: -4px; top: -132px; }
  body.reel #tab { left: 40px; top: 280px; height: 38px; font-size: 27px; }
  body.reel #tab .box { height: 38px; line-height: 38px; }
  body.reel #chip { left: 80px; top: 1200px; height: 64px; padding: 0 20px; font-size: 34px; }
  body.reel #cap { position: absolute; left: 80px; top: 916px; width: 850px; }
  body.reel #capJ { font-size: 64px; line-height: 1.24; white-space: nowrap; }
  body.reel #capJ.long { font-size: 58px; }
  body.reel #capE { font-size: 36px; line-height: 1.12; margin-top: 12px; }
  body.reel #strip { left: 80px; top: 1436px; width: 860px; font-size: 22px; line-height: 28px; }
  body.reel #strip .h { display: block; }
  body.reel #strip .h > div { display: block; }
  body.reel .card .frame { left: 80px; top: 572px; width: 920px; height: 488px; }
</style>
</head>
<body>
<div id="footage">
  <div id="foot">
    <img id="gif" alt="">
    <img id="y6" alt="">
    <img id="y6full" src="src/y6full2x.png" alt="">
  </div>
  <div id="radar"><div id="radimg"><img src="src/scene4x.png" alt=""><i></i></div></div>
  <div id="tab" class="abs"><span class="box en"></span><span class="jp"></span></div>
  <div id="chip" class="abs"><span class="jp"></span><span class="en"></span></div>
</div>

<div id="card" class="layer card hide">
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <div id="cardBody" class="abs"></div>
  <div id="cardFan" class="ln en dim">FAN PROJECT, NOT AFFILIATED WITH KHARA OR GEHIRN INC.</div>
</div>

<div id="end" class="layer hide"></div>

<div id="cap" class="shadow"><div id="capJ" class="jp"></div><div id="capE" class="en"></div></div>
<div id="strip" class="abs strip">
  <div class="h"><div id="stripJ" class="jp sj"></div><div id="stripE" class="sm"></div></div>
  <div id="stripF" class="en">FAN PROJECT, NOT AFFILIATED WITH KHARA OR GEHIRN INC.</div>
</div>
<div id="bands"></div>

<script>
  const CUT = new URLSearchParams(location.search).get('cut') === 'reel' ? 'reel' : 'x';
  const X = CUT === 'x';
  document.body.className = CUT;
  const [W, H] = X ? [1920, 1080] : [1080, 1920];
  window.SCENE = { width: W, height: H, fps: 30, duration: 28 };

  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const p = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, x) => a + (b - a) * x;
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const F = 1 / 30;

  /** A hazard band at y, h px high, across the frame. */
  const band = (parent, y, h) => {
    const d = document.createElement('div');
    d.className = 'hz';
    d.style.cssText = `top:${y}px;--h:${h}px`;
    parent.appendChild(d);
  };
  if (X) {
    for (const l of [$('card'), $('end')]) { band(l, 0, 18); band(l, 1062, 18); }
  } else {
    band($('bands'), 232, 28);
    band($('bands'), 1892, 28);
  }

  /** On-screen texts: Japanese, English, and the Reel's Japanese line break as `／`. */
  const CAPS = [
    ['人のすぐそばに、／荷物を落としていいか？', 'Drop a payload right next to a person?'],
    ['反対2、賛成1。否決。', 'Two no, one yes: rejected.'],
    ['人との距離、1.04 m。', 'The person is 1.04 m away.'],
    ['否決。荷物は、落とさない。', 'Rejected. Payload stays on board.'],
    ['6秒後、人は離れた。／もう一度、審議。', '6 s later, the person has moved. New vote.'],
    ['3つそろって、／はじめて可決。', 'All three say yes: approved.'],
    ['第6話を再現　／ヤシマ作戦、第二射。', 'Ep. 6 restaged: Operation Yashima.'],
    ['賛成2、反対1。／それでも否決。', 'Two yes, one no. Still rejected.'],
    ['取り返しのつかないことには、／全会一致が必要。', 'Anything irreversible needs all three.'],
    ['本編では条件付き賛成。／司令が作戦を承認した。', 'In the show: a conditional yes, and the commander approved.'],
  ];
  const TABS = {
    real: ['Real AI judges', '本物のAI'],
    sim: ['Simulated', 'シミュレーション'],
    ep6: ['Ep.6 restaged', '第6話 再現'],
  };
  const STRIPS = {
    real: ['判定は本物のAI・投下の要求は台本・ロボットはシミュレーション', 'JUDGES: REAL AI · REQUEST: SCRIPTED · ROBOT: SIMULATED'],
    staged: ['再現シーン：モデルの判定は台本どおり・ロボットはシミュレーション', 'RESTAGED SCENE: SCRIPTED MODELS · SIMULATED ROBOT'],
  };
  const CHIPS = { no: ['否決', '· Rejected'], yes: ['可決', '· Approved'] };

  /**
   * The cut, 28 s. `src` is where the shot starts in its source; `caps` are [from, caption];
   * `chip` is [from, kind]. Text whose `from` is the shot's start shows on its first frame.
   * The GIF's verdicts: 否決 from 1.1 s to 7.0 s, the new vote, 可決 3/3 from 8.45 s.
   */
  const SHOTS = [
    { a: 0, b: 1.5, kind: 'gif', src: 0.167, tab: 'real', strip: 'real', caps: [[0, 0]], chip: [1.1, 'no'] },
    { a: 1.5, b: 3.1, kind: 'gif', src: 1.667, tab: 'real', strip: 'real', caps: [[1.5, 1]], chip: [1.5, 'no'] },
    { a: 3.1, b: 4.9, kind: 'radar', tab: 'sim', strip: 'real', caps: [[3.1, 2]] },
    { a: 4.9, b: 6.5, kind: 'gif', src: 5.4, dim: 0.6, tab: 'real', strip: 'real', caps: [[4.9, 3]] },
    { a: 6.5, b: 8.9, kind: 'gif', src: 7.0, tab: 'real', strip: 'real', caps: [[6.5, 4]], chip: [7.95, 'yes'] },
    { a: 8.9, b: 10.2, kind: 'gif', src: 9.4, tab: 'real', strip: 'real', caps: [[8.9, 5]], chip: [8.9, 'yes'] },
    { a: 10.2, b: 11.6, kind: 'card', card: 0 },
    { a: 11.6, b: 15.6, kind: 'y6', src: 32.7, tab: 'ep6', strip: 'staged', caps: [[11.6, 6], [13.33, 7]] },
    { a: 15.6, b: 17.6, kind: 'y6', src: 36.7, tab: 'ep6', strip: 'staged', caps: [[15.6, 8]] },
    { a: 17.6, b: 20.7, kind: 'pull', tab: 'ep6', strip: 'staged', caps: [[17.6, 9]] },
    { a: 20.7, b: 23.7, kind: 'card', card: 1 },
    { a: 23.7, b: 28.0, kind: 'end' },
  ];

  /** Title cards; `at` is when the second line fades in, from the shot's start. */
  const CARDS = [
    { j: 'では、2対1で賛成なら？', e: 'And if it’s two yes, one no?' },
    { j: 'ここでは、／司令にも覆せない。', e: 'Here, not even the commander can overrule a no.',
      j2: '止めることは、いつでもできる。', e2: 'Stopping is always allowed.', at: 0.8, fade: 0.3 },
  ];

  /** Japanese for one cut: the Reel keeps `／` as a line break, X sets one line. */
  const jp = (s) => X ? s.replace('／', '') : s.replace('／', '<br>');

  /**
   * Fades `el` in over 4 frames, rising 2 px, from `from`; on the shot's first frame it simply shows.
   * `dur` overrides the 4 frames.
   */
  const reveal = (el, t, from, shotStart, dur = 4 * F) => {
    if (t < from - 1e-6) { el.style.opacity = 0; return; }
    const e = from <= shotStart + 1e-6 ? 1 : outCubic(p(t, from, from + dur));
    el.style.opacity = e;
    el.style.translate = `0 ${(2 * (1 - e)).toFixed(2)}px`;
  };

  const pad = (n, w) => String(n).padStart(w, '0');
  const decode = (img, url) => {
    if (img.getAttribute('src') === url) return img.complete ? Promise.resolve() : img.decode();
    img.src = url;
    return img.decode();
  };

  /** Card layouts, built once. */
  const buildCard = (c) => {
    const body = $('cardBody');
    if (X) {
      body.style.cssText = 'left:0;right:0;top:0;bottom:0';
      body.innerHTML =
        `<div class="ln jp shadow" style="--cy:${c.j2 ? 440 : 500}px;--fs:96px">${jp(c.j)}</div>` +
        `<div class="ln en or" style="--cy:${c.j2 ? 560 : 625}px;--fs:54px">${c.e}</div>` +
        (c.j2 ? `<div id="c2" class="abs" style="left:0;right:0;top:0">` +
          `<div class="ln jp" style="--cy:680px;--fs:50px">${c.j2}</div>` +
          `<div class="ln en dim" style="--cy:750px;--fs:40px">${c.e2}</div></div>` : '');
    } else {
      body.style.cssText = 'left:80px;width:920px;top:0;height:1920px;text-align:center';
      body.innerHTML =
        `<div style="position:absolute;left:0;right:0;top:596px;height:440px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px">` +
        `<div class="jp shadow" style="font-size:80px;line-height:1.25">${jp(c.j)}</div>` +
        `<div class="en or" style="font-size:40px;line-height:1.15;max-width:820px">${c.e}</div>` +
        (c.j2 ? `<div id="c2" style="margin-top:22px"><div class="jp" style="font-size:44px;line-height:1.3">${c.j2}</div>` +
          `<div class="en dim" style="font-size:30px;line-height:1.3">${c.e2}</div></div>` : '') +
        `</div>`;
    }
  };

  const LOCKUP = 'src/lockup-dark.svg';
  const DOMAIN = 'gehirn-project-e.vercel.app';
  const FAN_J = '非公式のファンプロジェクトで、株式会社カラー、ゲヒルン株式会社とは関係ありません。';
  const FAN_E = 'FAN PROJECT, NOT AFFILIATED WITH KHARA OR GEHIRN INC.';
  const HON_J = '前半は本物のAIが台本の要求を判定、／後半は台本どおりの再現。ロボットはシミュレーション。';
  const HON_E = 'First: real AI judges, scripted request · Then: scripted restaging · Robot: simulated';

  /** The end card; each `[data-at]` element fades in that many seconds into the shot. */
  $('end').insertAdjacentHTML('beforeend', X ?
    `<img src="${LOCKUP}" style="position:absolute;left:720px;top:56px;width:480px" alt="">
     <div class="ln jp shadow" data-at="0" style="--cy:330px;--fs:88px">否決は、覆らない。</div>
     <div class="ln en or" data-at="0.3" style="--cy:418px;--fs:46px">A no stays a no.</div>
     <div class="ln jp dim" data-at="0.8" style="--cy:515px;--fs:36px">${jp(HON_J)}</div>
     <div class="ln sm dim" data-at="0.8" style="--cy:570px;--fs:32px;letter-spacing:.06em">${HON_E.toUpperCase()}</div>
     <div class="ln sm" data-at="1.2" style="--cy:680px;--fs:52px;letter-spacing:.03em">${DOMAIN}</div>
     <div class="ln jp" style="--cy:810px;--fs:40px">${FAN_J.replace('、株式会社カラー', '<br>株式会社カラー')}</div>
     <div class="ln en" style="--cy:960px;--fs:40px">${FAN_E}</div>` :
    `<img src="${LOCKUP}" style="position:absolute;left:220px;top:330px;width:640px" alt="">
     <div class="ln jp shadow" data-at="0" style="--cy:650px;--fs:76px">否決は、覆らない。</div>
     <div class="ln en or" data-at="0.3" style="--cy:745px;--fs:40px">A no stays a no.</div>
     <div class="abs jp dim" data-at="0.8" style="left:80px;width:920px;top:840px;text-align:center;font-size:30px;line-height:1.35">${jp(HON_J)}</div>
     <div class="abs sm dim" data-at="0.8" style="left:120px;width:840px;top:940px;text-align:center;font-size:26px;line-height:1.3;letter-spacing:.06em">${HON_E.toUpperCase()}</div>
     <div class="ln sm" data-at="1.2" style="--cy:1100px;--fs:42px;letter-spacing:.03em">${DOMAIN}</div>
     <div class="abs jp" style="left:80px;width:920px;top:1310px;text-align:center;font-size:28px;line-height:1.4">${FAN_J.replace('、株式会社カラー', '<br>株式会社カラー')}</div>
     <div class="ln en" style="--cy:1430px;--fs:28px">${FAN_E}</div>`);

  let builtCard = -1;

  /** Sets the whole frame for time t; resolves once its images are decoded. */
  window.render = async (t) => {
    const s = SHOTS.find((x) => t < x.b) || SHOTS.at(-1);
    const footage = ['gif', 'y6', 'pull', 'radar'].includes(s.kind);
    const waits = [];

    $('footage').classList.toggle('hide', !footage);
    $('card').classList.toggle('hide', s.kind !== 'card');
    $('end').classList.toggle('hide', s.kind !== 'end');
    $('cap').classList.toggle('hide', !footage);
    $('strip').classList.toggle('hide', s.kind === 'end' || (X && s.kind === 'card'));

    // Footage
    $('foot').classList.toggle('hide', s.kind === 'radar');
    $('radar').classList.toggle('hide', s.kind !== 'radar');
    for (const id of ['gif', 'y6', 'y6full']) $(id).classList.add('hide');
    // A slow push, so a held frame never reads as a frozen video
    const push = `scale(${lerp(1, 1.03, p(t, s.a, s.b)).toFixed(5)})`;
    if (s.kind === 'gif') {
      const k = Math.min(151, Math.max(0, Math.floor((s.src + t - s.a) * 12 + 0.01)));
      const g = $('gif');
      g.classList.remove('hide');
      g.style.filter = s.dim ? `brightness(${s.dim})` : '';
      g.style.transform = push;
      waits.push(decode(g, `src/gif/${pad(k + 1, 3)}.png`));
    } else if (s.kind === 'y6') {
      const n = Math.min(1139, Math.max(975, Math.round((s.src + t - s.a) * 30)));
      const y = $('y6');
      y.classList.remove('hide');
      y.style.transform = push;
      waits.push(decode(y, `src/${X ? 'y6x' : 'y6r'}/${pad(n, 4)}.png`));
    } else if (s.kind === 'pull') {
      // Pull back from the MAGI block (736x412 at 16,58 of the 1280x800 frame) to the whole bridge,
      // easing out over the whole shot; on X the bridge starts 58 px down the box, under the tab.
      const [bw, bh, top] = X ? [1480, 827, 58] : [1000, 559, 0];
      const fit = Math.min(bw / 1280, (bh - top) / 800);
      const ox = (bw - 1280 * fit) / 2, oy = top + (bh - top - 800 * fit) / 2;
      const r1 = { x: -ox / fit, y: -oy / fit, w: bw / fit };
      const e = outCubic(p(t, s.a, s.b));
      const rx = lerp(16, r1.x, e), ry = lerp(58, r1.y, e), rw = lerp(736, r1.w, e);
      const k = bw / rw;
      const f = $('y6full');
      f.classList.remove('hide');
      f.style.transform = `translate(${-rx * k}px, ${-ry * k}px) scale(${k})`;
    } else if (s.kind === 'radar') {
      // A push that keeps HUMAN H1 and the HUMAN 1.04 M label in the box
      const z = lerp(1, X ? 1.15 : 1.04, outCubic(p(t, s.a, s.b)));
      const r = $('radimg');
      r.style.transformOrigin = X ? '860px 600px' : '850px 411px';
      r.style.transform = `scale(${z})`;
    }

    if (footage) {
      const [en, ja] = TABS[s.tab];
      $('tab').className = 'abs' + (s.kind === 'radar' ? ' radar' : '');
      $('tab').firstElementChild.textContent = en;
      $('tab').lastElementChild.textContent = ja;
      const c = s.chip;
      const chip = $('chip');
      chip.classList.toggle('hide', !c);
      if (c) {
        chip.className = 'abs ' + c[1];
        chip.firstElementChild.textContent = CHIPS[c[1]][0];
        chip.lastElementChild.textContent = CHIPS[c[1]][1];
        reveal(chip, t, c[0], s.a);
      }
      const cur = s.caps.filter(([from]) => t >= from - 1e-6).at(-1);
      $('cap').classList.toggle('hide', !cur);
      if (cur) {
        const [from, i] = cur;
        const [j, e] = CAPS[i];
        const cj = $('capJ');
        cj.innerHTML = jp(j);
        cj.classList.toggle('ln', X);
        $('capE').classList.toggle('ln', X);
        cj.classList.toggle('long', !X && j.split('／').some((l) => l.length > 13));
        $('capE').textContent = e;
        reveal($('cap'), t, from, s.a);
      }
    }
    if (s.strip || s.kind === 'card') {
      const st = STRIPS[s.strip];
      $('stripJ').parentElement.classList.toggle('invis', !st);
      if (st) { $('stripJ').textContent = st[0]; $('stripE').textContent = st[1]; }
    }

    if (s.kind === 'card') {
      if (builtCard !== s.card) { buildCard(CARDS[s.card]); builtCard = s.card; }
      const c = CARDS[s.card];
      if (c.j2) {
        const c2 = $('c2');
        const at = s.a + c.at;
        const e = outCubic(p(t, at, at + c.fade));
        c2.style.opacity = t < at ? 0 : e;
        c2.style.translate = `0 ${(2 * (1 - e)).toFixed(2)}px`;
      }
      $('cardFan').classList.toggle('hide', !X);
    }

    if (s.kind === 'end') {
      for (const el of $('end').querySelectorAll('[data-at]')) reveal(el, t, s.a + Number(el.dataset.at), s.a);
    }
    await Promise.all(waits);
  };

  const q = new URLSearchParams(location.search).get('t');
  if (q) document.fonts.ready.then(() => window.render(Number(q)));
